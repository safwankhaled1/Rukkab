name: rukkab
description: Rukkab rider and driver application for Palestine.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^7.0.0
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  file_picker: ^10.3.6
  intl: ^0.20.2
  timezone: ^0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
